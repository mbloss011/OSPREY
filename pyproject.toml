[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "osprey"
version = "0.1.0"
description = "OSPREY — defensive web-shield agent: enrolled hosts only"
requires-python = ">=3.11"
dependencies = ["httpx"]
[project.scripts]
osprey = "osprey.cli:main"
[tool.setuptools.packages.find]
include = ["osprey*"]
